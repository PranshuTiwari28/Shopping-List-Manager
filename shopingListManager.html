<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            padding:40px;
        }

        .container{
            width:600px;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        form{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        input{
            flex:1;
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            border:none;
            background:royalblue;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#2458d3;
        }

        #shoppingContainer{
            margin-top:20px;
        }

        .card{
            background:#f8f8f8;
            padding:15px;
            border-radius:8px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
        }

        .deleteBtn{
            background:crimson;
        }

        .deleteBtn:hover{
            background:#b3002d;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Shopping List Manager</h1>

        <form id="shoppingForm">
            <input
                type="text"
                id="itemName"
                placeholder="Item Name"
                required
            >

            <input
                type="number"
                id="quantity"
                placeholder="Quantity"
                required
                min="1"
            >

            <button type="submit">
                Add Item
            </button>
        </form>

        <h3>
            Total Items :
            <span id="totalItems">0</span>
        </h3>

        <div id="shoppingContainer">

        </div>

    </div>

    <script>let shoppingForm = document.getElementById("shoppingForm");
let itemName = document.getElementById("itemName");
let quantity = document.getElementById("quantity");
let shoppingContainer = document.getElementById("shoppingContainer");
let totalItems = document.getElementById("totalItems");

let count = 0;

shoppingForm.addEventListener("submit", function (e) {
    e.preventDefault();

    let item = itemName.value;
    let qty = quantity.value;

    let card = document.createElement("div");
    card.classList.add("card");

    card.innerHTML = `
        <div>
            <h3>${item}</h3>
            <p>Quantity : ${qty}</p>
        </div>

        <button class="deleteBtn">
            Delete
        </button>
    `;

    let deleteBtn = card.querySelector(".deleteBtn");

    deleteBtn.addEventListener("click", function () {
        card.remove();
        count--;
        totalItems.textContent = count;
    });

    shoppingContainer.appendChild(card);

    count++;
    totalItems.textContent = count;

    itemName.value = "";
    quantity.value = "";
});</script>

</body>
</html>
